# This is a reusable workflow for running the Enablement test for App Signals.
# It is meant to be called from another workflow.
# Read more about reusable workflows: https://docs.github.com/en/actions/using-workflows/reusing-workflows#overview
name: Java Metric Limiter Use Case
on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      test-cluster-name:
        required: true
        type: string
      caller-workflow-name:
        required: true
        type: string
      java-version:
        description: "Currently support version 8, 11, 17, 21, 22"
        required: false
        type: string
        default: '11'
      adot-image-name:
        required: false
        type: string
      cw-agent-operator-tag:
        required: false
        type: string
    outputs:
      job-started:
        value: ${{ jobs.metric-limiter.outputs.job-started }}
      validation-result:
        value: ${{ jobs.metric-limiter.outputs.validation-result }}

permissions:
  id-token: write
  contents: read

env:
  # The precense of this env var is required for use by terraform and AWS CLI commands
  # It is not redundant
  E2E_TEST_AWS_REGION: ${{ inputs.aws-region }}
  CLUSTER_NAME: ${{ inputs.test-cluster-name }}
  CALLER_WORKFLOW_NAME: ${{ inputs.caller-workflow-name }}
  JAVA_VERSION: ${{ inputs.java-version }}
  ADOT_IMAGE_NAME: ${{ inputs.adot-image-name }}
  CW_AGENT_OPERATOR_TAG: ${{ inputs.cw-agent-operator-tag }}
  E2E_TEST_ACCOUNT_ID: ${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ACCOUNT_ID }}
  E2E_TEST_ROLE_NAME: ${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ROLE_NAME }}
  METRIC_NAMESPACE: ApplicationSignals
  LOG_GROUP_NAME: /aws/application-signals/data
  TEST_RESOURCES_FOLDER: ${GITHUB_WORKSPACE}
  REPOSITORY_NAME: ${{ github.event.repository.name }}

jobs:
  metric-limiter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      job-started: ${{ steps.job-started.outputs.job-started }}
      validation-result: ${{ steps.validation-result.outputs.validation-result }}
    steps:
      - name: Check if the job started
        id: job-started
        run: echo "job-started=true" >> "$GITHUB_OUTPUT"

      - name: Generate testing id and sample app namespace
        run: |
          # Sanitize the java version for a DNS-1123 namespace label (e.g. "java8", "java11").
          JAVA_VERSION_SLUG="java$(echo '${{ env.JAVA_VERSION }}' | tr -d '.')"
          echo TESTING_ID="metric-limiter-${JAVA_VERSION_SLUG}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          # Namespace is unique per parallel version job so concurrent runs sharing the cluster do not collide.
          echo SAMPLE_APP_NAMESPACE="ns-${JAVA_VERSION_SLUG}-${{ github.run_id }}-${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: 'aws-observability/aws-application-signals-test-framework'
          # TESTING: pin to the feature branch so the java_version variable and other changes are
          # present. REVERT to `... && 'main' || github.ref` before merge.
          ref: ${{ env.CALLER_WORKFLOW_NAME == 'main-build' && 'java-eks-parallel-wip' || github.ref }}
          fetch-depth: 0

      # We initialize Gradlew Daemon early on during the workflow because sometimes initialization
      # fails due to transient issues. If it fails here, then we will try again later before the validators
      - name: Initiate Gradlew Daemon
        id: initiate-gradlew
        uses: ./.github/workflows/actions/execute_and_retry
        continue-on-error: true
        with:
          command: "./gradlew :validator:build"
          cleanup: "./gradlew clean"
          max_retry: 3
          sleep_time: 60

      - name: Download enablement script
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          pre-command: "mkdir enablement-script && cd enablement-script"
          command: "wget https://raw.githubusercontent.com/aws-observability/application-signals-demo/main/scripts/eks/appsignals/enable-app-signals.sh 
          && wget https://raw.githubusercontent.com/aws-observability/application-signals-demo/main/scripts/eks/appsignals/clean-app-signals.sh"
          cleanup: "rm -f enable-app-signals.sh && rm -f clean-app-signals.sh"
          post-command: "chmod +x enable-app-signals.sh && chmod +x clean-app-signals.sh"

      - name: Remove log group deletion command
        if: always()
        working-directory: enablement-script
        run: |
          delete_log_group="aws logs delete-log-group --log-group-name '${{ env.LOG_GROUP_NAME }}' --region \$REGION"
          sed -i "s#$delete_log_group##g" clean-app-signals.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: arn:aws:iam::${{ env.E2E_TEST_ACCOUNT_ID }}:role/${{ env.E2E_TEST_ROLE_NAME }}
          aws-region: us-east-1

      - name: Retrieve account
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            ACCOUNT_ID, region-account/${{ env.E2E_TEST_AWS_REGION }}
            JAVA_MAIN_SAMPLE_APP_IMAGE, e2e-test/java-main-sample-app-image
            JAVA_REMOTE_SAMPLE_APP_IMAGE, e2e-test/java-remote-sample-app-image

      # If the workflow is running as a canary, then we want to log in to the aws account in the appropriate region
      - name: Configure AWS Credentials
        if: ${{ env.REPOSITORY_NAME == 'aws-application-signals-test-framework' }}
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/${{ env.E2E_TEST_ROLE_NAME }}
          aws-region: ${{ env.E2E_TEST_AWS_REGION }}

      # local directory to store the kubernetes config
      - name: Create kubeconfig directory
        run: mkdir -p ${{ github.workspace }}/.kube

      - name: Set KUBECONFIG environment variable
        run: echo KUBECONFIG="${{ github.workspace }}/.kube/config" >> "$GITHUB_ENV"

      - name: Set up kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.E2E_TEST_AWS_REGION }}

      - name: Download and install eksctl
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          pre-command: 'mkdir ${{ github.workspace }}/eksctl'
          command: 'curl -sLO "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz" 
            && tar -xzf eksctl_Linux_amd64.tar.gz -C ${{ github.workspace }}/eksctl && rm eksctl_Linux_amd64.tar.gz'
          cleanup: 'rm -f eksctl_Linux_amd64.tar.gz'

      - name: Add eksctl to Github Path
        run: |
          echo "${{ github.workspace }}/eksctl" >> "$GITHUB_PATH"

      # Delete only THIS version's namespace from a prior run. Do NOT bulk-delete all ns-* namespaces:
      # parallel version jobs share the cluster, and deleting all ns-* would destroy other running
      # jobs' namespaces mid-test.
      - name: Delete this version's sample app namespace if it lingers
        continue-on-error: true
        timeout-minutes: 5
        run: kubectl delete namespace "${{ env.SAMPLE_APP_NAMESPACE }}" --ignore-not-found

      - name: Create role for AWS access from the sample app
        id: create_service_account
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: "eksctl create iamserviceaccount \
          --name sa-${{ env.TESTING_ID }} \
          --namespace ${{ env.SAMPLE_APP_NAMESPACE }} \
          --cluster ${{ env.CLUSTER_NAME }} \
          --role-name eks-s3-access-${{ env.TESTING_ID }} \
          --attach-policy-arn arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess \
          --region ${{ env.E2E_TEST_AWS_REGION }} \
          --approve"
          cleanup: "eksctl delete iamserviceaccount \
          --name sa-${{ env.TESTING_ID }} \
          --namespace ${{ env.SAMPLE_APP_NAMESPACE }} \
          --cluster ${{ env.CLUSTER_NAME }} \
          --region ${{ env.E2E_TEST_AWS_REGION }}"
          sleep_time: 60

      - name: Set up terraform
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: "wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg"
          post-command: 'echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
              && sudo apt update && sudo apt install terraform'
          sleep_time: 60

      - name: Initiate Terraform
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: "cd ${{ env.TEST_RESOURCES_FOLDER }}/terraform/java/eks && terraform init && terraform validate"
          cleanup: "rm -rf .terraform && rm -rf .terraform.lock.hcl"
          max_retry: 6
          sleep_time: 60

      - name: Set Sample App Image
        run: |
          echo MAIN_SAMPLE_APP_IMAGE_ARN="${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.E2E_TEST_AWS_REGION }}.amazonaws.com/${{ env.JAVA_MAIN_SAMPLE_APP_IMAGE }}:v${{ env.JAVA_VERSION }}" >> "$GITHUB_ENV"
          echo REMOTE_SAMPLE_APP_IMAGE_ARN="${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.E2E_TEST_AWS_REGION }}.amazonaws.com/${{ env.JAVA_REMOTE_SAMPLE_APP_IMAGE }}:v${{ env.JAVA_VERSION }}" >> "$GITHUB_ENV"

      # The ADOT image this test injects. Set BEFORE deploy so the operator-image patch in the deploy
      # step can reference it. For the java repo this is the staging image under test.
      - name: Determine ADOT image to inject
        run: |
          if [ "${{ env.REPOSITORY_NAME }}" = "amazon-cloudwatch-agent" ]; then
            echo PATCH_IMAGE_ARN="${{ secrets.AWS_ECR_PRIVATE_REGISTRY }}/cwagent-integration-test:${{ github.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ env.REPOSITORY_NAME }}" = "amazon-cloudwatch-agent-operator" ]; then
            echo PATCH_IMAGE_ARN="${{ vars.ECR_OPERATOR_STAGING_REPO }}:${{ env.CW_AGENT_OPERATOR_TAG }}" >> "$GITHUB_ENV"
          elif [ "${{ env.REPOSITORY_NAME }}" = "aws-otel-java-instrumentation" ]; then
            echo PATCH_IMAGE_ARN="${{ env.ADOT_IMAGE_NAME }}" >> "$GITHUB_ENV"
          fi

      - name: Deploy sample app via terraform and wait for the endpoint to come online
        id: deploy-sample-app
        working-directory: terraform/java/eks
        run: |  
          # Attempt to deploy the sample app on an EKS instance and wait for its endpoint to come online. 
          # There may be occasional failures due to transitivity issues, so try up to 2 times. 
          # deployment_failed of 0 indicates that both the terraform deployment and the endpoint are running, while 1 indicates
          # that it failed at some point
          retry_counter=0
          max_retry=2
          while [ $retry_counter -lt $max_retry ]; do
            echo "Attempt $retry_counter"
            deployment_failed=0
            terraform apply -auto-approve \
              -var="test_id=${{ env.TESTING_ID }}" \
              -var="aws_region=${{ env.E2E_TEST_AWS_REGION }}" \
              -var="kube_directory_path=${{ github.workspace }}/.kube" \
              -var="eks_cluster_name=${{ env.CLUSTER_NAME }}" \
              -var="eks_cluster_context_name=$(kubectl config current-context)" \
              -var="test_namespace=${{ env.SAMPLE_APP_NAMESPACE }}" \
              -var="service_account_aws_access=sa-${{ env.TESTING_ID }}" \
              -var="sample_app_image=${{ env.MAIN_SAMPLE_APP_IMAGE_ARN }}" \
              -var="sample_remote_app_image=${{ env.REMOTE_SAMPLE_APP_IMAGE_ARN }}" \
              -var='account_id=${{ env.ACCOUNT_ID }}' \
              -var="java_version=${{ env.JAVA_VERSION }}" \
            || deployment_failed=$?

            if [ $deployment_failed -ne 0 ]; then
              echo "Terraform deployment was unsuccessful. Will attempt to retry deployment."
            fi

            # If the deployment_failed is still 0, then the terraform deployment succeeded and now try to connect to the endpoint
            # after installing App Signals. Attempts to connect will be made for up to 10 minutes
            if [ $deployment_failed -eq 0 ]; then
              . ${{ env.TEST_RESOURCES_FOLDER }}/.github/workflows/util/execute_and_retry.sh
              # Install the cluster-wide Application Signals addon. This is idempotent: the first
              # parallel version job installs it, the rest see it already present. Do NOT pass a
              # clean-up command here — deleting the shared addon would break other parallel jobs and
              # can leave the CloudWatch agent without its IRSA role (dropping telemetry cluster-wide).
              execute_and_retry 3 \
              "${{ env.TEST_RESOURCES_FOLDER }}/enablement-script/enable-app-signals.sh \
              ${{ env.CLUSTER_NAME }} \
              ${{ env.E2E_TEST_AWS_REGION }} \
              ${{ env.SAMPLE_APP_NAMESPACE }}" \
              "" \
              60

              aws eks update-kubeconfig --region ${{ env.E2E_TEST_AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

              # enable-app-signals.sh returns while the addon is still CREATING. The operator that
              # performs injection is deployed by the addon, so wait for the addon to reach ACTIVE
              # before patching it below — otherwise the patch/rollout races the install.
              execute_and_retry 30 \
                "[ \"\$(aws eks describe-addon --cluster-name ${{ env.CLUSTER_NAME }} --addon-name amazon-cloudwatch-observability --region ${{ env.E2E_TEST_AWS_REGION }} --query 'addon.status' --output text)\" = ACTIVE ]" \
                "" 20

              # Inject THIS test's ADOT image by patching the operator's cluster-wide
              # --auto-instrumentation-java-image arg. Every java version job injects the SAME
              # PATCH_IMAGE_ARN, so this shared arg is uncontended; patch only if it differs and retry
              # if a concurrent job wins the write. Restart ONLY the operator + this namespace's pods,
              # never the shared cloudwatch-agent.
              patched=0
              for patch_attempt in 1 2 3 4 5 6; do
                CURRENT_JAVA_IMAGE=$(kubectl get deploy -n amazon-cloudwatch amazon-cloudwatch-observability-controller-manager \
                  -o jsonpath='{range .spec.template.spec.containers[0].args[*]}{.}{"\n"}{end}' \
                  | sed -n 's/^--auto-instrumentation-java-image=//p')
                if [ "$CURRENT_JAVA_IMAGE" = "${{ env.PATCH_IMAGE_ARN }}" ]; then
                  echo "Operator java image already at target (${{ env.PATCH_IMAGE_ARN }})."
                  patched=1
                  break
                fi
                echo "Attempt $patch_attempt: patching '$CURRENT_JAVA_IMAGE' -> '${{ env.PATCH_IMAGE_ARN }}'"
                if kubectl get deploy -n amazon-cloudwatch amazon-cloudwatch-observability-controller-manager -o json \
                    | jq '.spec.template.spec.containers[0].args |= map(if test("^--auto-instrumentation-java-image=") then "--auto-instrumentation-java-image=${{ env.PATCH_IMAGE_ARN }}" else . end)' \
                    | kubectl apply -f - ; then
                  echo "Patch applied on attempt $patch_attempt."
                  patched=1
                  break
                fi
                echo "Patch attempt $patch_attempt lost a concurrent write; retrying..."
                sleep 10
              done
              if [ "$patched" -ne 1 ]; then echo "Failed to set operator java image."; exit 1; fi

              kubectl -n amazon-cloudwatch rollout status \
                deployment/amazon-cloudwatch-observability-controller-manager --timeout=180s \
                || echo "Operator rollout wait timed out; continuing (injection is verified below)."

              # Restart this namespace's pods so the operator injects instrumentation, then verify the
              # auto-instrumentation init container is present with the target image. Retry the restart
              # until injection takes effect (fail loudly rather than validate an uninstrumented app).
              # Wait on the instrumented app pods only, with NON-FATAL waits so the inject_attempt loop
              # can actually retry: execute_and_retry calls `exit 1` when exhausted, which would kill the
              # job on the first slow rollout. Diagnostics on failure identify the real cause
              # (ImagePullBackOff vs CrashLoopBackOff vs FailedScheduling). Same fix and rationale as
              # java-eks-test.yml -- see the longer comment there.
              inject_verified=0
              for inject_attempt in 1 2 3 4 5; do
                kubectl delete pods --all -n ${{ env.SAMPLE_APP_NAMESPACE }} || true

                wait_failed=0
                kubectl wait --for=condition=Ready --request-timeout '5m' --timeout '5m' \
                  pod -l app=sample-app -n ${{ env.SAMPLE_APP_NAMESPACE }} || wait_failed=1
                kubectl wait --for=condition=Ready --request-timeout '5m' --timeout '5m' \
                  pod -l app=remote-app -n ${{ env.SAMPLE_APP_NAMESPACE }} || wait_failed=1

                if [ "$wait_failed" -ne 0 ]; then
                  echo "::group::Diagnostics for attempt $inject_attempt (pods did not become Ready)"
                  kubectl get pods -n ${{ env.SAMPLE_APP_NAMESPACE }} -o wide || true
                  kubectl describe pod -l app=sample-app -n ${{ env.SAMPLE_APP_NAMESPACE }} || true
                  kubectl describe pod -l app=remote-app -n ${{ env.SAMPLE_APP_NAMESPACE }} || true
                  kubectl logs -l app=sample-app -n ${{ env.SAMPLE_APP_NAMESPACE }} \
                    --all-containers --tail=50 || true
                  kubectl describe nodes | grep -A 8 "Allocated resources" || true
                  echo "::endgroup::"
                fi

                INJECTED_IMAGE=$(kubectl get pod -n ${{ env.SAMPLE_APP_NAMESPACE }} --selector=app=sample-app \
                  -o jsonpath='{.items[0].spec.initContainers[?(@.name=="opentelemetry-auto-instrumentation-java")].image}' 2>/dev/null || true)
                if [ "$wait_failed" -eq 0 ] && [ "$INJECTED_IMAGE" = "${{ env.PATCH_IMAGE_ARN }}" ]; then
                  echo "Instrumentation injected with target image on attempt $inject_attempt: $INJECTED_IMAGE"
                  inject_verified=1
                  break
                fi
                echo "Attempt $inject_attempt incomplete (wait_failed=$wait_failed, image='${INJECTED_IMAGE:-none}'); retrying restart..."
                sleep 20
              done
              if [ "$inject_verified" -ne 1 ]; then echo "Pods never became Ready with the target instrumentation image."; exit 1; fi
            fi
          
            # If the deployment_failed is 1 then either the terraform deployment or the endpoint connection failed, so first destroy the
            # resources created from terraform and try again.
            if [ $deployment_failed -eq 1 ]; then
              # Do NOT run clean-app-signals.sh here: the Application Signals addon is cluster-wide and
              # shared by the other parallel version jobs — deleting it would break them (and can drop
              # the CloudWatch agent's IRSA role). Only tear down this version's own terraform resources.
              echo "Destroying terraform"
              terraform destroy -auto-approve \
                -var="test_id=${{ env.TESTING_ID }}" \
                -var="aws_region=${{ env.E2E_TEST_AWS_REGION }}" \
                -var="kube_directory_path=${{ github.workspace }}/.kube" \
                -var="eks_cluster_name=${{ env.CLUSTER_NAME }}" \
                -var="eks_cluster_context_name=$(kubectl config current-context)" \
                -var="test_namespace=${{ env.SAMPLE_APP_NAMESPACE }}" \
                -var="service_account_aws_access=sa-${{ env.TESTING_ID }}" \
                -var="sample_app_image=${{ env.MAIN_SAMPLE_APP_IMAGE_ARN }}" \
                -var="sample_remote_app_image=${{ env.REMOTE_SAMPLE_APP_IMAGE_ARN }}" \
                -var="java_version=${{ env.JAVA_VERSION }}"

              retry_counter=$(($retry_counter+1))
            else
              # If deployment succeeded, then exit the loop
              break
            fi
          
            if [ $retry_counter -ge $max_retry ]; then
              echo "Max retry reached, failed to deploy terraform and connect to the endpoint. Exiting code"
              exit 1
            fi
          done

      - name: Get Remote Service Deployment Name
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: echo "REMOTE_SERVICE_DEPLOYMENT_NAME=$(kubectl get deployments -n ${{ env.SAMPLE_APP_NAMESPACE }} --selector=app=remote-app -o jsonpath='{.items[0].metadata.name}')" >> "$GITHUB_ENV"
          max_retry: 3
          sleep_time: 30

      - name: Get Remote Service IP
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: echo "REMOTE_SERVICE_POD_IP=$(kubectl get pods -n ${{ env.SAMPLE_APP_NAMESPACE }} --selector=app=remote-app -o jsonpath='{.items[0].status.podIP}')" >> "$GITHUB_ENV"
          max_retry: 3
          sleep_time: 30

      - name: Verify pod Adot image
        run: |
          kubectl get pods -n ${{ env.SAMPLE_APP_NAMESPACE }} --output json | \
          jq '.items[0].status.initContainerStatuses[0].imageID'

      - name: Verify pod CWAgent image
        run: |
          kubectl get pods -n amazon-cloudwatch --output json | \
          jq '.items[0].status.containerStatuses[0].imageID'

      - name: Update metric limiter threshold
        run: |
          aws eks update-addon \
            --cluster-name ${{ env.CLUSTER_NAME }} \
            --addon-name amazon-cloudwatch-observability \
            --region ${{ env.E2E_TEST_AWS_REGION }} \
            --configuration-values '{"agent":{"config":{"logs":{"metrics_collected":{"app_signals":{"limiter":{"drop_threshold":2}}}}}}}' \
            --resolve-conflicts OVERWRITE

      - name: Get the sample app endpoint
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: echo "APP_ENDPOINT=$(kubectl get pods -n ${{ env.SAMPLE_APP_NAMESPACE }} --selector=app=sample-app -o jsonpath='{.items[0].status.podIP}'):8080" >> "$GITHUB_ENV"
          max_retry: 3
          sleep_time: 30

      - name: Set endpoints for the traffic generator
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: kubectl set env -n ${{ env.SAMPLE_APP_NAMESPACE }} deployment/traffic-generator MAIN_ENDPOINT=${{ env.APP_ENDPOINT }} REMOTE_ENDPOINT=${{ env.REMOTE_SERVICE_POD_IP }}
          max_retry: 3
          sleep_time: 30

      - name: Initiate Gradlew Daemon
        if: steps.initiate-gradlew.outcome == 'failure'
        uses: ./.github/workflows/actions/execute_and_retry
        continue-on-error: true
        with:
          command: "./gradlew :validator:build"
          cleanup: "./gradlew clean"
          max_retry: 3
          sleep_time: 60

      - name: Call endpoints and validate generated metrics
        id: other-operation-metric-validation
        if: steps.deploy-sample-app.outcome == 'success' && !cancelled()
        run: ./gradlew validator:run --args='-c java/metric_limiter/metric-validation.yml
          --testing-id ${{ env.TESTING_ID }}
          --endpoint http://${{ env.APP_ENDPOINT }}
          --region ${{ env.E2E_TEST_AWS_REGION }}
          --account-id ${{ env.ACCOUNT_ID }}
          --metric-namespace ${{ env.METRIC_NAMESPACE }}
          --log-group ${{ env.LOG_GROUP_NAME }}
          --app-namespace ${{ env.SAMPLE_APP_NAMESPACE }}
          --platform-info ${{ env.CLUSTER_NAME }}
          --service-name sample-application-${{ env.TESTING_ID }}
          --remote-service-name sample-remote-application-${{ env.TESTING_ID }}
          --remote-service-deployment-name ${{ env.REMOTE_SERVICE_DEPLOYMENT_NAME }}
          --query-string ip=${{ env.REMOTE_SERVICE_POD_IP }}&testingId=${{ env.TESTING_ID }}
          --rollup'

      - name: Output validation result
        if: always()
        id: validation-result
        run: |
          if [ "${{ steps.other-operation-metric-validation.outcome }}" = "success" ]; then
            echo "validation-result=success" >> "$GITHUB_OUTPUT"
          else
            echo "validation-result=failure" >> "$GITHUB_OUTPUT"
          fi

      # Clean up Procedures
      # NOTE: the cluster-wide Application Signals addon is intentionally NOT removed here — it is
      # shared by the other parallel version jobs and persists on the long-lived test cluster.
      # Deleting it (clean-app-signals.sh) would break sibling jobs and can drop the CloudWatch
      # agent's IRSA role. This job cleans up only its own namespace and terraform resources.

      - name: Delete this version's sample app namespace
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: kubectl delete namespace ${{ env.SAMPLE_APP_NAMESPACE }} --ignore-not-found

      - name: Terraform destroy
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        working-directory: terraform/java/eks
        run: |
          terraform destroy -auto-approve \
            -var="test_id=${{ env.TESTING_ID }}" \
            -var="aws_region=${{ env.E2E_TEST_AWS_REGION }}" \
            -var="kube_directory_path=${{ github.workspace }}/.kube" \
            -var="eks_cluster_name=${{ env.CLUSTER_NAME }}" \
            -var="eks_cluster_context_name=$(kubectl config current-context)" \
            -var="test_namespace=${{ env.SAMPLE_APP_NAMESPACE }}" \
            -var="service_account_aws_access=sa-${{ env.TESTING_ID }}" \
            -var="sample_app_image=${{ env.MAIN_SAMPLE_APP_IMAGE_ARN }}" \
            -var="sample_remote_app_image=${{ env.REMOTE_SAMPLE_APP_IMAGE_ARN }}" \
            -var="java_version=${{ env.JAVA_VERSION }}"

      - name: Remove aws access service account
        if: always()
        continue-on-error: true
        run: |
          eksctl delete iamserviceaccount \
          --name sa-${{ env.TESTING_ID }} \
          --namespace ${{ env.SAMPLE_APP_NAMESPACE }} \
          --cluster ${{ env.CLUSTER_NAME }} \
          --region ${{ env.E2E_TEST_AWS_REGION }}
          
