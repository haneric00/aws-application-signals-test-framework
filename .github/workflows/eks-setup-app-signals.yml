# Start-of-pipeline setup of Application Signals on a shared EKS test cluster.
#
# This is the mirror image of eks-cleanup-app-signals.yml. The caller invokes this FIRST, and gates
# every EKS test job on it, so that installing the shared amazon-cloudwatch-observability addon and
# the cloudwatch-agent IRSA service account happens EXACTLY ONCE while nothing else uses the cluster.
#
# Why this job exists (the IRSA injection race):
#   enable-app-signals.sh runs `eksctl create iamserviceaccount --override-existing-serviceaccounts`
#   UNCONDITIONALLY on every invocation -- that step is not guarded by an "already present" check the
#   way the addon install is. When N parallel version jobs each ran the script, a sibling job could
#   delete and recreate the cloudwatch-agent service account AFTER the addon's DaemonSet pods had
#   already been admitted. IRSA credentials are injected by a mutating webhook at pod-admission time
#   ONLY, so those pods kept running with no AWS_ROLE_ARN / no aws-iam-token volume, silently fell
#   back to the EC2 node role (which has no logs:PutLogEvents), and returned AccessDeniedException
#   for their entire lifetime. Every parallel job's telemetry was then dropped and all validators
#   failed on missing data.
#
#   The race is nondeterministic -- whoever wins the interleaving decides whether a run is green --
#   which is why it presented as flaky and appeared "fixed" on branches that reused a warm cluster.
#   Because eks-cleanup-app-signals.yml tears the addon down at the END of every pipeline, main
#   re-enters this race on every single run, while a feature branch that never ran cleanup cold-started
#   at most once and then inherited a warm, already-credentialed cluster.
#
# Serializing setup here removes the race by construction rather than retrying around it.
name: EKS Setup Application Signals

on:
  workflow_call:
    inputs:
      test-cluster-name:
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: 'us-east-1'

permissions:
  id-token: write
  contents: read

env:
  E2E_TEST_AWS_REGION: ${{ inputs.aws-region }}
  CLUSTER_NAME: ${{ inputs.test-cluster-name }}
  E2E_TEST_ACCOUNT_ID: ${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ACCOUNT_ID }}
  E2E_TEST_ROLE_NAME: ${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ROLE_NAME }}
  LOG_GROUP_NAME: /aws/application-signals/data

jobs:
  eks-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: arn:aws:iam::${{ env.E2E_TEST_ACCOUNT_ID }}:role/${{ env.E2E_TEST_ROLE_NAME }}
          aws-region: ${{ env.E2E_TEST_AWS_REGION }}

      - name: Retrieve account
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ACCOUNT_ID, region-account/${{ env.E2E_TEST_AWS_REGION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/${{ env.E2E_TEST_ROLE_NAME }}
          aws-region: ${{ env.E2E_TEST_AWS_REGION }}

      - name: Download enablement script
        run: |
          mkdir -p enablement-script && cd enablement-script
          wget -q https://raw.githubusercontent.com/aws-observability/application-signals-demo/main/scripts/eks/appsignals/enable-app-signals.sh
          chmod +x enable-app-signals.sh

      # The e2e log group is shared and long-lived; the enablement script must not delete it.
      - name: Remove log group deletion command
        working-directory: enablement-script
        run: |
          delete_log_group="aws logs delete-log-group --log-group-name '${{ env.LOG_GROUP_NAME }}' --region \$REGION"
          sed -i "s#$delete_log_group##g" enable-app-signals.sh

      - name: Set up kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.E2E_TEST_AWS_REGION }}

      # enable-app-signals.sh calls `eksctl create iamserviceaccount`, so eksctl must be on PATH.
      - name: Install eksctl
        run: |
          curl -sLO "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz"
          tar -xzf eksctl_Linux_amd64.tar.gz -C /usr/local/bin
          rm -f eksctl_Linux_amd64.tar.gz
          eksctl version

      # Safety guard: mirror of the cleanup job's guard. If sample-app namespaces are present, another
      # run is using the cluster; recreating the shared SA now is exactly the hazard this job prevents.
      - name: Warn if tests are already running
        run: |
          active=$(kubectl get namespace -o name 2>/dev/null | grep -E 'namespace/ns-' || true)
          if [ -n "$active" ]; then
            echo "::warning::Active test namespaces present while setting up shared App Signals state:"
            echo "$active"
          else
            echo "No active test namespaces; safe to set up App Signals."
          fi

      - name: Install Application Signals (addon + cloudwatch-agent IRSA)
        working-directory: enablement-script
        run: |
          . ${{ github.workspace }}/.github/workflows/util/execute_and_retry.sh
          # `default` namespace: this job only establishes cluster-wide state. Per-test namespace
          # annotation is not needed here -- App Signals mode comes from the operator's cluster-wide
          # --auto-instrumentation-python-image arg, which the per-version test jobs patch.
          execute_and_retry 3 \
            "./enable-app-signals.sh ${{ env.CLUSTER_NAME }} ${{ env.E2E_TEST_AWS_REGION }} default" \
            "" \
            60

      # enable-app-signals.sh returns as soon as the addon is REQUESTED. The operator is not serving
      # until the addon is ACTIVE.
      - name: Wait for addon to become ACTIVE
        run: |
          . ${{ github.workspace }}/.github/workflows/util/execute_and_retry.sh
          execute_and_retry 30 \
            "[ \"\$(aws eks describe-addon --cluster-name ${{ env.CLUSTER_NAME }} --addon-name amazon-cloudwatch-observability --region ${{ env.E2E_TEST_AWS_REGION }} --query 'addon.status' --output text)\" = ACTIVE ]" \
            "" 20

      # ADDON ACTIVE DOES NOT IMPLY THE AGENT HAS CREDENTIALS. The addon reconciling only means its
      # resources exist; it says nothing about whether the DaemonSet pods were admitted while the
      # cloudwatch-agent service account carried its eks.amazonaws.com/role-arn annotation. Assert the
      # projected identity is actually present, and bounce the DaemonSet if it is not. This is safe
      # here (and ONLY here) because no test job is running yet, so no in-flight telemetry can be lost.
      - name: Verify cloudwatch-agent has IRSA credentials projected
        run: |
          kubectl rollout status daemonset/cloudwatch-agent -n amazon-cloudwatch --timeout=300s

          for attempt in 1 2 3 4 5 6; do
            missing=$(kubectl get pods -n amazon-cloudwatch -l app.kubernetes.io/name=cloudwatch-agent \
              -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.spec.containers[0].env[?(@.name=="AWS_ROLE_ARN")].value}{"\n"}{end}' \
              | awk -F'|' '$2==""{print $1}')

            if [ -z "$missing" ]; then
              echo "All cloudwatch-agent pods have AWS_ROLE_ARN projected."
              kubectl get pods -n amazon-cloudwatch -l app.kubernetes.io/name=cloudwatch-agent \
                -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.spec.containers[0].env[?(@.name=="AWS_ROLE_ARN")].value}{"\n"}{end}'
              exit 0
            fi

            echo "Attempt $attempt: cloudwatch-agent pods missing IRSA credentials: $missing"
            echo "Restarting DaemonSet so the IRSA webhook re-injects credentials at admission."
            kubectl rollout restart daemonset/cloudwatch-agent -n amazon-cloudwatch
            kubectl rollout status daemonset/cloudwatch-agent -n amazon-cloudwatch --timeout=300s
          done

          echo "::error::cloudwatch-agent pods still lack IRSA credentials after 6 restart attempts."
          echo "Agent would authenticate as the EC2 node role and get AccessDeniedException on"
          echo "logs:PutLogEvents, causing every downstream EKS validator to fail on missing telemetry."
          kubectl get sa cloudwatch-agent -n amazon-cloudwatch -o yaml || true
          kubectl describe daemonset cloudwatch-agent -n amazon-cloudwatch || true
          exit 1
